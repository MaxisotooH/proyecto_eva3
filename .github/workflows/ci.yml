name: CI - Django + MariaDB (XAMPP)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.4   # misma base de datos que trae XAMPP
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tienda_api
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_NAME: tienda_api
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Revisar proyecto
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Migrar y cargar datos (MySQL)
        run: python manage.py migrate --noinput && python manage.py loaddata productos
      - name: Pruebas automaticas (MySQL)
        run: python manage.py test productos -v 2
      - name: Prueba de humo con el servidor real
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          sleep 5
          set -x
          curl -sf http://127.0.0.1:8000/api/productos/ -H "Accept: application/json"
          curl -sf http://127.0.0.1:8000/api/productos/4 -H "Accept: application/json"
          curl -s -X POST http://127.0.0.1:8000/api/productos/ -H "Content-Type: application/json" -d '{"nombre":"Producto CI","precio":1000}'
          curl -s -X PUT http://127.0.0.1:8000/api/productos/ -H "Content-Type: application/json" -d '{"id":9999,"precio":1}'
          curl -s -X DELETE http://127.0.0.1:8000/api/productos/4
          curl -sf http://127.0.0.1:8000/ > /dev/null
